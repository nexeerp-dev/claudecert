<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ea">
<title>Head Start Claude – Learn & Get Certified</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#/"><span class="logo-bot">🤖</span> Head Start <b>Claude</b></a>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/track/beginner" data-nav="beginner">Beginner</a>
    <a href="#/track/cert" data-nav="cert">Cert Lessons</a>
    <a href="#/certs" data-nav="certs">Exam Plans</a>
    <a href="#/practice" data-nav="practice">Practice</a>
    <a href="#/exam" data-nav="exam">Mock Exam</a>
    <a href="#/qa" data-nav="qa">Q&amp;A</a>
  </nav>
  <div class="top-right">
    <button id="menuBtn" class="icon-btn menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
    <button id="themeBtn" class="icon-btn" title="Light / dark">🌓</button>
    <div class="xp" title="Your points"><span id="lvl">Lv 1</span> · <span id="xp">0</span> XP</div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<div id="listenBar" class="listen-bar" hidden>
  <span class="lb-title">🔊 Listen</span>
  <button id="lbPlay" class="lb-btn">▶ Play lesson</button>
  <button id="lbPause" class="lb-btn" disabled>⏸ Pause</button>
  <button id="lbStop" class="lb-btn" disabled>⏹ Stop</button>
  <label>Speed
    <select id="lbRate"><option value="0.8">Slow</option><option value="1" selected>Normal</option><option value="1.25">Fast</option><option value="1.5">Faster</option></select>
  </label>
  <label>Voice <select id="lbVoice"></select></label>
</div>

<footer class="foot">
  Made for learners. Not an official Anthropic product. Always check the official docs for the latest model names and features.
</footer>

<script src="js/content_common.js"></script>
<script src="js/content_beginner.js"></script>
<script src="js/content_cert.js"></script>
<script src="js/content_certs.js"></script>
<script src="js/content_practice.js"></script>
<script src="js/deep_beginner.js"></script>
<script src="js/deep_cert_a.js"></script>
<script src="js/deep_cert_b.js"></script>
<script src="js/deep_cert_c.js"></script>
<script src="js/app.js"></script>
</body>
</html>
